name: Rule proposal
description: Propose a new rule or a change to one of the 12
labels: [rule]
body:
  - type: textarea
    id: before
    attributes:
      label: Before
      description: A real response you got from an agent. Paste it exactly.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      description: What it should have said instead.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who does this help, in one sentence?
    validations:
      required: true
  - type: dropdown
    id: which
    attributes:
      label: Which rule does this change?
      options: ["1 Notice overload and switch", "2 One line", "3 No questions", "4 No instructions or shoulds", "5 No cheer", "6 No breathe/calm down", "7 Don't name their feelings", "8 One line of presence", "9 Don't fill silence", "10 Don't resume the task", "11 No repeated apology", "12 Harm: one human resource once", "New rule (say which one it replaces)"]
    validations:
      required: true
