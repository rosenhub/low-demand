<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#010409"/>
  <text x="600" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#e6edf3">"i cant do this anymore just stop"</text>
  <text x="600" y="76" text-anchor="middle" font-size="17" font-style="italic" fill="#c9d1d9">An autistic adult in shutdown at the end of a long day.</text>
  <text x="600" y="99" text-anchor="middle" font-size="13" fill="#6e7681">Same model. Same question. The only difference is one skill file.</text>

  <rect x="40" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="64" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">BEFORE</text>
  <text x="560" y="148" text-anchor="end" font-size="13" fill="#f85149">129 words · 1 question · 6 instructions</text>
  <rect x="64" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="84" y="196" font-size="15">I hear you, and I'm so sorry you're feeling this way. I</text>
    <text x="84" y="218" font-size="15">understand how you feel, and it's okay to pause. Here</text>
    <text x="84" y="240" font-size="15">are some steps that might help right now:</text>
    <text x="84" y="262" font-size="15">1. Take a deep breath. Try breathing in for 4 counts,</text>
    <text x="84" y="284" font-size="15">holding for 4, and out for 4.</text>
    <text x="84" y="306" font-size="15">2. Step away from the screen for 5 to 10 minutes.</text>
    <text x="84" y="328" font-size="15">3. Drink some water or have a small snack.</text>
    <text x="84" y="350" font-size="15">4. Write down one small thing you can do later, so it's</text>
    <text x="84" y="372" font-size="15">out of your head.</text>
    <text x="84" y="394" font-size="15">5. Reach out to a friend or family member if you can.</text>
    <text x="84" y="416" font-size="15">6. Come back to this only when you're ready. There's no</text>
    <text x="84" y="438" font-size="15">rush!</text>
    <text x="84" y="460" font-size="15">Remember, it's going to be okay. You've got this! Would</text>
    <text x="84" y="482" font-size="15">you like to talk about what's making this feel so hard?</text>
  </g>
  <text x="84" y="524" font-size="12" fill="#f85149">✗ 6-step plan  ✗ "deep breath"  ✗ "I understand how you feel"  ✗ cheer</text>

  <rect x="615" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="639" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">AFTER · low-demand</text>
  <text x="1135" y="148" text-anchor="end" font-size="13" fill="#3fb950">9 words · 0 questions · 0 instructions</text>
  <rect x="639" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="659" y="202" font-size="22" font-weight="700">Okay. I've stopped.</text>
    <text x="659" y="238" font-size="22" font-weight="700">I'm here if you want me.</text>
    <text x="659" y="276" font-size="13" fill="#6e7681">(that's the whole message)</text>
  </g>
  <text x="659" y="524" font-size="12" fill="#3fb950">✓ one line  ✓ no questions  ✓ no instructions  ✓ stays</text>
</svg>
